<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4756"/>
      <stop offset="1" stop-color="#161b21"/>
    </linearGradient>
    <linearGradient id="add" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe4ea"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- ground -->
  <rect x="80" y="404" width="352" height="10" rx="5" fill="#8d97a2"/>
  <!-- existing floors -->
  <rect x="136" y="316" width="200" height="80" rx="8" fill="#8d97a2"/>
  <rect x="136" y="352" width="200" height="6" fill="#3a4756" opacity=".55"/>
  <!-- protected-space extension -->
  <rect x="340" y="316" width="36" height="80" rx="6" fill="#b9c2cb"/>
  <!-- added full floors -->
  <rect x="136" y="250" width="240" height="56" rx="8" fill="url(#add)"/>
  <rect x="136" y="184" width="240" height="56" rx="8" fill="url(#add)"/>
  <!-- partial roof floor, 70% -->
  <rect x="136" y="118" width="168" height="56" rx="8" fill="#ffffff" opacity=".55"/>
</svg>
